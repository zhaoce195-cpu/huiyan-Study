# =====================================================================
# 慧眼医疗云平台 V2.0 — Nginx 生产环境配置
# 适用：单机部署 / Docker 部署 / Kubernetes Ingress 后端
#
# 关键能力：
#   1. Vue3 history 路由刷新 404 修复（try_files）
#   2. 静态资源强缓存（一年 + immutable）
#   3. index.html 不缓存（保证发版立即生效）
#   4. gzip / brotli 双压缩（优先返回预压缩 .br/.gz 文件）
#   5. /api/ 反向代理至 FastAPI 后端
#   6. 大文件上传支持（眼底图批量上传 200MB）
#   7. 安全相关响应头（HSTS / XSS / Frame）
# =====================================================================

# 反向代理后端地址（按实际改）
upstream huiyan_backend {
    # FastAPI 默认端口 8000；如多实例，加多行 server，自动负载均衡
    server 127.0.0.1:8000;
    # server 127.0.0.1:8001 backup;
    keepalive 32;
}

# Brotli 预压缩支持（需要 nginx 编译时带 ngx_brotli 模块；没有则忽略）
# brotli on;
# brotli_static on;
# brotli_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

# Gzip 配置 —— 同时启用 gzip_static，优先返回 vite 构建出的 .gz 文件
gzip on;
gzip_static on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/javascript
    text/xml
    application/json
    application/javascript
    application/x-javascript
    application/xml
    application/xml+rss
    application/wasm
    image/svg+xml
    font/ttf
    font/otf
    font/woff
    font/woff2;

# ====================== HTTP → HTTPS 重定向（按需启用） ======================
# server {
#     listen 80;
#     server_name huiyan.example.com;
#     return 301 https://$host$request_uri;
# }

server {
    # 如启用 HTTPS，把 listen 改为：
    # listen 443 ssl http2;
    # ssl_certificate     /etc/nginx/ssl/huiyan.crt;
    # ssl_certificate_key /etc/nginx/ssl/huiyan.key;
    # ssl_protocols       TLSv1.2 TLSv1.3;
    # ssl_ciphers         HIGH:!aNULL:!MD5;
    # ssl_session_cache   shared:SSL:10m;
    # ssl_session_timeout 1d;

    listen 80;
    server_name huiyan.example.com;          # 改为实际域名 / IP

    charset utf-8;
    server_tokens off;

    # 上传体积上限（覆盖批量眼底图上传场景）
    client_max_body_size 200M;
    client_body_buffer_size 1M;
    client_body_timeout 300s;
    client_header_timeout 60s;
    send_timeout 300s;

    # 前端静态文件根目录（vite build 产物 dist 部署到这里）
    root /usr/share/nginx/html;
    index index.html;

    # ====================== 安全响应头 ======================
    # 部署形态说明（报告 P0：明文 HTTP 与「数据加密传输」声明不一致）：
    #   推荐用 deploy/Caddyfile + docker-compose.tls.yml 在前面做 TLS 终止，
    #   此时本 server 只在容器内网监听 80，TLS 与 HSTS 由 Caddy 统一下发。
    #   若坚持由 nginx 直接对外提供服务，必须解开下方 HTTPS 段并启用 HSTS，
    #   不允许以明文 80 直接对外。
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # HSTS 仅在 nginx 自身承载 HTTPS 时启用；
    # 由 Caddy 终止 TLS 时不要在此重复下发，避免两处配置不一致。
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # 访问 / 错误日志（按需启用）
    access_log /var/log/nginx/huiyan_access.log main;
    error_log  /var/log/nginx/huiyan_error.log warn;

    # ===================================================================
    # 1. 后端 API 反向代理 —— /api/xxx → http://huiyan_backend/xxx
    # ===================================================================
    location /api/ {
        # 去掉 /api 前缀转发到 FastAPI；如后端本身就有 /api 前缀，把这行改为 proxy_pass http://huiyan_backend;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://huiyan_backend;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # 长连接 / 大文件超时
        proxy_connect_timeout 60s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # （可选）后端健康检查直连
    location = /api/health {
        proxy_pass http://huiyan_backend/health;
        access_log off;
    }

    # ===================================================================
    # 2. 静态资源强缓存（带 hash，可一年缓存）
    # ===================================================================
    location ~* ^/assets/.+\.(js|css|woff2?|ttf|otf|eot|png|jpe?g|gif|svg|webp|ico|mp4|webm)$ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:woff2?|ttf|otf|eot)$ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    # ===================================================================
    # 3. index.html 永不缓存，保证发版立即生效
    # ===================================================================
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # robots.txt / favicon.ico 不写日志
    location = /favicon.ico  { access_log off; log_not_found off; }
    location = /robots.txt   { access_log off; log_not_found off; }

    # ===================================================================
    # 4. Vue3 history 路由 SPA 兜底 —— 刷新页面不报 404
    # ===================================================================
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ===================================================================
    # 5. 错误页
    # ===================================================================
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
