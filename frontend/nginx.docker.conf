# =====================================================================
# 慧眼医疗云 · 容器内 Nginx 配置（Docker Compose 专用）
# 关键点：
#   1. /api/  → backend:8000，保留完整路径（后端前缀就是 /api/v1，不能剥离）
#   2. /static/ → backend:8000，访问上传的头像 / 眼底图 / 报告 PDF
#   3. Vue3 history 路由刷新兜底（try_files → index.html）
#   4. 静态资源强缓存 + index.html 不缓存
# =====================================================================

upstream huiyan_backend {
    server backend:8000;
    keepalive 32;
}

gzip on;
gzip_static on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
    text/plain text/css text/javascript text/xml
    application/json application/javascript application/xml
    application/wasm image/svg+xml
    font/ttf font/otf font/woff font/woff2;

server {
    listen 80;
    server_name _;

    charset utf-8;
    server_tokens off;

    # 批量眼底图上传
    client_max_body_size 200M;
    client_body_timeout 300s;
    send_timeout 300s;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # -------- 后端 API 反代（保留 /api/v1 完整路径）--------
    location /api/ {
        proxy_pass http://huiyan_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_connect_timeout 60s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # -------- 后端静态资源（上传内容）--------
    location /static/ {
        # 图片可能被替换/更新：禁用强缓存，每次用 ETag 校验（未变返回 304）
        add_header Cache-Control "no-cache" always;
        proxy_pass http://huiyan_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # -------- 前端带 hash 的静态资源强缓存 --------
    location ~* ^/assets/.+\.(js|css|woff2?|ttf|otf|eot|png|jpe?g|gif|svg|webp|ico|mp4|webm)$ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # -------- index.html 不缓存，发版立即生效 --------
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # -------- Vue3 history SPA 兜底 --------
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html { internal; }
}
