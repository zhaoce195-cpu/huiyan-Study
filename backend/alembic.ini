# Alembic configuration.
# Keep this file ASCII-only: configparser reads it with the system
# default encoding (GBK on Chinese Windows), so non-ASCII comments
# make `alembic upgrade` crash with UnicodeDecodeError.
# The database URL is injected by env.py from app.core.config.settings;
# there is no need to edit sqlalchemy.url here.

[alembic]
script_location = alembic
prepend_sys_path = .
sqlalchemy.url = driver://user:pass@localhost/dbname

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
