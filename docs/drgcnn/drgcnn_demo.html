<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>DRGCNN · 双眼 DR 预测 Demo</title>
  <style>
    :root {
      --bg: #f5f9ff;
      --panel: #ffffff;
      --line: #e6effe;
      --text: #1d2129;
      --muted: #86909c;
      --primary: #1677ff;
      --danger: #f53f3f;
      --warn: #ff7d00;
      --ok: #00b42a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 24px;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    h1 { font-size: 18px; margin: 0 0 16px; }
    .layout { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .card {
      background: var(--panel); border: 1px solid var(--line);
      border-radius: 12px; padding: 16px;
    }
    .card h2 { font-size: 14px; margin: 0 0 10px; color: var(--text); }
    .drop {
      border: 1px dashed #c9cdd4; border-radius: 8px;
      padding: 18px; text-align: center; cursor: pointer;
      transition: border-color .15s, background .15s;
      color: var(--muted);
    }
    .drop:hover { border-color: var(--primary); color: var(--primary); }
    .drop.has-image { padding: 6px; border-style: solid; }
    .drop img { max-width: 100%; max-height: 240px; border-radius: 6px; display: block; margin: 0 auto; }
    .row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
    .row .grow { flex: 1; }
    button {
      padding: 8px 14px; border-radius: 8px; border: 1px solid var(--primary);
      background: var(--primary); color: #fff; cursor: pointer; font-size: 13px;
    }
    button[disabled] { opacity: .55; cursor: not-allowed; }
    button.ghost { background: #fff; color: var(--primary); }
    .muted { color: var(--muted); font-size: 12px; }
    .result-block { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .eye-card {
      background: #fafbfc; border: 1px solid var(--line);
      border-radius: 8px; padding: 12px;
    }
    .grade-badge {
      display: inline-block; padding: 2px 10px; border-radius: 999px;
      font-size: 12px; font-weight: 600;
    }
    .grade-0 { background: rgba(0,180,42,.12); color: var(--ok); }
    .grade-1 { background: rgba(255,125,0,.12); color: var(--warn); }
    .grade-2 { background: rgba(255,125,0,.18); color: var(--warn); }
    .grade-3 { background: rgba(245,63,63,.12); color: var(--danger); }
    .grade-4 { background: rgba(245,63,63,.2); color: var(--danger); font-weight: 700; }
    .heatmap { width: 100%; margin-top: 8px; border-radius: 6px; }
    .err { color: var(--danger); font-size: 13px; margin-top: 8px; }
    .toast {
      position: fixed; left: 50%; top: 24px; transform: translateX(-50%);
      background: var(--text); color: #fff; padding: 8px 16px;
      border-radius: 6px; font-size: 13px; opacity: 0; transition: opacity .2s;
      z-index: 9; pointer-events: none;
    }
    .toast.show { opacity: 1; }
    .spinner {
      width: 16px; height: 16px; border: 2px solid #c9cdd4; border-top-color: var(--primary);
      border-radius: 50%; animation: r 0.8s linear infinite; display: inline-block; vertical-align: middle;
    }
    @keyframes r { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <h1>DRGCNN · 双眼 DR 预测 Demo</h1>
  <div class="muted" style="margin-bottom: 12px">
    上传左右眼眼底图（JPG/PNG，建议 ≤ 5MB），调用 <code>POST /predict_twoeyes</code>，渲染病变等级 + GradCAM 热力图。
  </div>

  <div class="layout">
    <!-- 左眼 -->
    <div class="card">
      <h2>左眼</h2>
      <label class="drop" id="leftDrop">
        <input type="file" id="leftFile" accept="image/png,image/jpeg" hidden />
        <span id="leftHint">点击或拖拽上传左眼图</span>
      </label>
    </div>

    <!-- 右眼 -->
    <div class="card">
      <h2>右眼</h2>
      <label class="drop" id="rightDrop">
        <input type="file" id="rightFile" accept="image/png,image/jpeg" hidden />
        <span id="rightHint">点击或拖拽上传右眼图</span>
      </label>
    </div>
  </div>

  <div class="row" style="margin-top: 12px">
    <button id="btnPredict">
      <span id="btnText">开始预测</span>
    </button>
    <button id="btnReset" class="ghost">重置</button>
    <span class="grow"></span>
    <span class="muted" id="elapsed"></span>
  </div>

  <div id="errBox" class="err" style="display:none"></div>

  <!-- 结果 -->
  <div id="resultPanel" class="card" style="margin-top: 16px; display:none">
    <h2>预测结果</h2>
    <div class="row" style="margin-bottom: 8px">
      <span class="muted">综合最大等级：</span>
      <span id="maxGrade"></span>
    </div>
    <div class="result-block">
      <div class="eye-card">
        <div class="row">
          <strong>左眼</strong>
          <span id="leftGradeBadge" class="grade-badge"></span>
          <span class="grow"></span>
          <span class="muted">回归值 <span id="leftProb">—</span></span>
        </div>
        <img id="leftHeatmap" class="heatmap" alt="左眼热力图" />
      </div>
      <div class="eye-card">
        <div class="row">
          <strong>右眼</strong>
          <span id="rightGradeBadge" class="grade-badge"></span>
          <span class="grow"></span>
          <span class="muted">回归值 <span id="rightProb">—</span></span>
        </div>
        <img id="rightHeatmap" class="heatmap" alt="右眼热力图" />
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

<script>
/* ============================================================
   常量配置
   ============================================================ */
const BASE_URL = 'http://113.219.243.122:9050';
const PREDICT_URL = BASE_URL + '/predict_twoeyes';
const TIMEOUT_MS = 60000;          // 推理 + 网络 + base64 体积，预留 60s
const MAX_FILE_BYTES = 8 * 1024 * 1024;
const ACCEPT_TYPES = ['image/jpeg', 'image/png'];

const GRADE_TEXT = ['无 DR', '轻度 NPDR', '中度 NPDR', '重度 NPDR', '增殖性 PDR'];

/* ============================================================
   工具
   ============================================================ */
function toast(msg, ms = 1800) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), ms);
}

function showError(msg) {
  const box = document.getElementById('errBox');
  box.style.display = 'block';
  box.textContent = msg;
}

function clearError() {
  const box = document.getElementById('errBox');
  box.style.display = 'none';
  box.textContent = '';
}

/** File → data:image/...;base64,... */
function fileToDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result || ''));
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(file);
  });
}

/** 用 Canvas 把过大的图压缩到 1024 短边（保留长宽比），减少 base64 体积 */
async function compressImageIfNeeded(file) {
  if (file.size <= MAX_FILE_BYTES) return file;
  const img = await new Promise((resolve, reject) => {
    const i = new Image();
    i.onload = () => resolve(i);
    i.onerror = reject;
    i.src = URL.createObjectURL(file);
  });
  const maxSide = 1024;
  const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
  const cw = Math.round(img.width * scale);
  const ch = Math.round(img.height * scale);
  const canvas = document.createElement('canvas');
  canvas.width = cw; canvas.height = ch;
  canvas.getContext('2d').drawImage(img, 0, 0, cw, ch);
  return await new Promise((resolve) =>
    canvas.toBlob((b) => resolve(b || file), 'image/jpeg', 0.9)
  );
}

/* ============================================================
   上传槽：点击 + 拖拽 + 预览
   ============================================================ */
class UploadSlot {
  constructor(side) {
    this.side = side;
    this.dataUrl = '';   // 最终给后端用的字符串
    this.previewUrl = ''; // 给本地展示用（也可直接用 dataUrl）
    this.drop = document.getElementById(side + 'Drop');
    this.input = document.getElementById(side + 'File');
    this.hint = document.getElementById(side + 'Hint');
    this._bind();
  }
  _bind() {
    this.drop.addEventListener('click', () => this.input.click());
    this.input.addEventListener('change', (e) => {
      const f = e.target.files && e.target.files[0];
      if (f) this._setFile(f);
    });
    ['dragenter','dragover'].forEach(ev =>
      this.drop.addEventListener(ev, e => { e.preventDefault(); })
    );
    this.drop.addEventListener('drop', (e) => {
      e.preventDefault();
      const f = e.dataTransfer.files && e.dataTransfer.files[0];
      if (f) this._setFile(f);
    });
  }
  async _setFile(file) {
    if (!ACCEPT_TYPES.includes(file.type)) {
      toast('仅支持 PNG / JPG');
      return;
    }
    try {
      const compressed = await compressImageIfNeeded(file);
      const dataUrl = await fileToDataUrl(compressed);
      this.dataUrl = dataUrl;
      this.drop.classList.add('has-image');
      this.drop.innerHTML = `<img src="${dataUrl}" alt="${this.side} eye">`;
    } catch (e) {
      toast('读取图片失败');
      console.error(e);
    }
  }
  reset() {
    this.dataUrl = '';
    this.drop.classList.remove('has-image');
    this.drop.innerHTML =
      `<input type="file" id="${this.side}File" accept="image/png,image/jpeg" hidden>` +
      `<span id="${this.side}Hint">点击或拖拽上传${this.side === 'left' ? '左' : '右'}眼图</span>`;
    this.input = document.getElementById(this.side + 'File');
    this._bind();
  }
}

const left = new UploadSlot('left');
const right = new UploadSlot('right');

/* ============================================================
   API 调用：带超时 + 错误码适配
   ============================================================ */
async function predictTwoEyes(leftDataUrl, rightDataUrl) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), TIMEOUT_MS);
  let resp;
  try {
    resp = await fetch(PREDICT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ leftUrl: leftDataUrl, rightUrl: rightDataUrl }),
      signal: ctrl.signal,
    });
  } catch (e) {
    if (e.name === 'AbortError') {
      throw new Error('请求超时（60s）。请检查网络或减小图片体积后重试。');
    }
    throw new Error('网络异常：' + e.message);
  } finally {
    clearTimeout(timer);
  }

  let data = null;
  try { data = await resp.json(); } catch { /* ignore */ }

  if (!resp.ok) {
    const msg = (data && data.error) || ('HTTP ' + resp.status);
    if (resp.status === 400) throw new Error('参数错误：' + msg);
    if (resp.status === 404) throw new Error('图像未找到：' + msg);
    if (resp.status === 500) throw new Error('服务端错误：' + msg);
    throw new Error('调用失败：' + msg);
  }
  if (data && data.error) throw new Error('服务端报错：' + data.error);
  return data;
}

/* ============================================================
   渲染
   ============================================================ */
function renderResult(raw) {
  const panel = document.getElementById('resultPanel');
  panel.style.display = 'block';

  const lp = Number(raw.left_eye_prediction);
  const rp = Number(raw.right_eye_prediction);
  const max = Math.max(lp, rp);

  const set = (id, text, gradeForBadge) => {
    const el = document.getElementById(id);
    el.textContent = text;
    el.className = 'grade-badge grade-' + gradeForBadge;
  };

  set('leftGradeBadge', `${lp} · ${GRADE_TEXT[lp] || '未知'}`, lp);
  set('rightGradeBadge', `${rp} · ${GRADE_TEXT[rp] || '未知'}`, rp);
  set('maxGrade', `${max} · ${GRADE_TEXT[max] || '未知'}`, max);

  document.getElementById('leftProb').textContent = (raw.left_eye_probability ?? 0).toFixed(3);
  document.getElementById('rightProb').textContent = (raw.right_eye_probability ?? 0).toFixed(3);

  // 热力图：服务端返回的是完整 data URL，直接放 src 即可
  document.getElementById('leftHeatmap').src = raw.left_eye_heatmap_base64 || '';
  document.getElementById('rightHeatmap').src = raw.right_eye_heatmap_base64 || '';
}

/* ============================================================
   按钮事件
   ============================================================ */
const btn = document.getElementById('btnPredict');
const btnText = document.getElementById('btnText');
const elapsedEl = document.getElementById('elapsed');

btn.addEventListener('click', async () => {
  clearError();
  if (!left.dataUrl || !right.dataUrl) {
    toast('请先上传左右眼图像');
    return;
  }
  btn.disabled = true;
  btnText.innerHTML = '<span class="spinner"></span> 推理中…';
  const t0 = performance.now();
  try {
    const raw = await predictTwoEyes(left.dataUrl, right.dataUrl);
    renderResult(raw);
    elapsedEl.textContent = `耗时 ${((performance.now() - t0) / 1000).toFixed(1)}s`;
  } catch (e) {
    showError(e.message || String(e));
    elapsedEl.textContent = '';
  } finally {
    btn.disabled = false;
    btnText.textContent = '开始预测';
  }
});

document.getElementById('btnReset').addEventListener('click', () => {
  clearError();
  left.reset(); right.reset();
  document.getElementById('resultPanel').style.display = 'none';
  elapsedEl.textContent = '';
});
</script>
</body>
</html>
